<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sombras nas caixas</title>
  <style>
    div.box {
      width: 110px;
      height: 110px;
      background-color: #0df621e2;
      display: inline-block;
      margin: 10px;
    }
    div#box1 {
      box-shadow: 0px 0px 8px #00000079;
    }
    div#box2 {
      box-shadow: 5px 5px 0px #00000079;
    }
    div#box3 {
      box-shadow: -5px -5px 8px #00000079;
    }
  </style>
</head>
<body>
  <div class="box" id="box1"></div>
  <div class="box" id="box2"></div>
  <div class="box" id="box3"></div>
</body>
</html>
