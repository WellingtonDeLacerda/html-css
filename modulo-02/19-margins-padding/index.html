<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margins/Padding</title>
    <style>
        body{
            font-family:Arial, Helvetica, sans-serif;
            background-color: #6ca28090;
        }
        div#box{
            background-color:lightslategrey;
            width: 150px;
            height: 150px;
            padding: 10px;
            margin: 10px 0px 10px 50px;
            text-align: center;
        }
        p{
            background-color: #a2365790;
            padding: 5px;
        }
        a{
            padding: 5px 8px 12px 8px;
            margin: 10px;
            padding-top: 40px;
            background-color: #448ea290;
            color: white;
        }
    </style>
</head>
<body>
  <h1>Margins/paddings</h1> 
  <h2>Exemplo de margin e padding em block</h2>
  <div id="box"> caixa </div>
  <h2>Exemplo de margin e padding inline</h2>
  <p>
    Um link de teste 
    <a href="#">Clicando aqui</a>
    Exemplo inline
  </p>
</body>
</html>
